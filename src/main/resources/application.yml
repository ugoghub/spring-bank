spring:
  application:
    name: bank-system-test

  datasource:
    url: jdbc:h2:mem:bank-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true